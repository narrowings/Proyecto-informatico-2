name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Compuerta de QA: si las imágenes no construyen, el commit no llega al ambiente QA (infra/qa/deploy.sh).
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose de QA
        run: docker compose -f infra/qa/docker-compose.qa.yml --env-file infra/qa/qa.env.example config -q
      - name: Construir imagen de la API
        run: docker build -f apps/api/Dockerfile -t red-api:ci .
      - name: Construir imagen web
        run: docker build -f apps/web/Dockerfile -t red-web:ci .
